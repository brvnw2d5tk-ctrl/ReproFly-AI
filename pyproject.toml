[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprofly"
version = "1.0.0"
description = "ReproFly-AI: a blinded, tool-mediated autonomous-scientist benchmark on the complete male Drosophila CNS connectome"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
urls = { Repository = "https://github.com/brvnw2d5tk-ctrl/ReproFly-AI" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=15",
    "h5py>=3.10",
    "anndata>=0.10.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.3"]
dev = ["pytest>=8.0", "psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reprofly = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that touch the real read-only data repository (skipped unless REPROFLY_DATA_ROOT is set)",
]
addopts = "-q"
